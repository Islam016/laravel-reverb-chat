name: screenshots

on:
  push:
    branches: [screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up the chat app
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          (php artisan reverb:start > reverb.log 2>&1 &)
          (php artisan queue:work > queue.log 2>&1 &)
          (php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &)
          sleep 5

      - name: Set up the arabic-search demo
        run: |
          mkdir demo && cp .screenshots/demo.php demo/
          cd demo && composer require islam016/arabic-search --no-interaction --no-progress
          (php -S 127.0.0.1:8100 -t . > ../demo.log 2>&1 &)
          sleep 2

      - name: Take screenshots
        run: |
          set +e
          ann() { python3 -c "import sys;d=open(sys.argv[1],encoding='utf-8',errors='replace').read()[-3500:];[print('::error title='+sys.argv[2]+'::'+c.replace('%','%25').replace('\r','').replace('\n','%0A')) for c in [d[i:i+1700] for i in range(0,len(d),1700)]]" "$1" "$2"; }
          sudo apt-get update -qq > apt.log 2>&1; sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji >> apt.log 2>&1 || ann apt.log apt
          cd .screenshots
          npm init -y > /dev/null; npm install playwright@1.49.1 > ../npm.log 2>&1 || ann ../npm.log npm
          npx playwright install --with-deps chromium > ../pw.log 2>&1 || ann ../pw.log playwright-install
          node shoot.mjs > ../shoot.log 2>&1; ann ../shoot.log shoot
          ls -la screens || true
          tail -5 ../serve.log ../reverb.log ../demo.log 2>/dev/null > ../srv.log; ann ../srv.log servers

      - name: Commit screenshots
        run: |
          git config user.name "Islam Gaber"
          git config user.email "islamgaber873@gmail.com"
          git add .screenshots/screens || true
          git commit -m "Add screenshots" || echo "nothing to commit"
          git push
